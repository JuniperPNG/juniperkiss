---
layout: default
---
<div class="shell shell--reading">
  <header class="post-header">
    {%- if page.eyebrow %}<p class="section__eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {%- if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </header>

  <div class="prose rich-text">
    {{ content }}
  </div>
</div>
