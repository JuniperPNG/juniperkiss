---
layout: default
---
<article class="post">
  <header class="hero">
    <p class="breadcrumb-label">Blog</p>
    <h1>{{ page.title }}</h1>
    <p class="subtitle post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.tags.size > 0 %}&nbsp;&middot;&nbsp;{{ page.tags | join: ", " }}{% endif %}
    </p>
  </header>
  <main class="post-content">
    {{ content }}
  </main>
  <div class="post-footer">
    <a href="/blog/">&larr; All posts</a>
  </div>
</article>
