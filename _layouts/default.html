<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-GB' }}" data-theme="dark">
<head>
  {%- include head.html -%}
</head>
<body class="{{ page.body_class }}">
  <a class="skip-link" href="#main">Skip to main content</a>

  {%- include masthead.html -%}
  {%- include breadcrumbs.html -%}

  <main id="main" class="has-bramble" tabindex="-1">
    {%- include bramble.html -%}
    {{ content }}
  </main>

  {%- include footer.html -%}
  {%- assign asset_version = site.time | date: "%Y%m%d%H%M%S" -%}
  <script src="{{ '/assets/js/theme.js' | relative_url }}?v={{ asset_version }}" defer></script>
  <script src="{{ '/assets/js/nav.js' | relative_url }}?v={{ asset_version }}" defer></script>
  <script src="{{ '/assets/js/reveal.js' | relative_url }}?v={{ asset_version }}" defer></script>
  <script src="{{ '/assets/js/image-protection.js' | relative_url }}?v={{ asset_version }}" defer></script>
</body>
</html>
