<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-GB' }}" data-theme="dark">
<head>
  {%- include head.html -%}
</head>
<body class="{{ page.body_class }}">
  <a class="skip-link" href="#main">Skip to main content</a>

  {%- include masthead.html -%}
  {%- include breadcrumbs.html -%}
  {%- include section-nav.html -%}

  <main id="main" class="has-bramble" tabindex="-1">
    {%- include bramble.html -%}
    {{ content }}
  </main>

  <button class="scroll-top" type="button" data-scroll-top aria-label="Scroll back to the top" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="m5 15 7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  {%- include footer.html -%}
  {%- assign asset_version = site.time | date: "%Y%m%d%H%M%S" -%}
  <script src="{{ '/assets/js/theme.js' | relative_url }}?v={{ asset_version }}" defer></script>
  <script src="{{ '/assets/js/nav.js' | relative_url }}?v={{ asset_version }}" defer></script>
  <script src="{{ '/assets/js/section-nav.js' | relative_url }}?v={{ asset_version }}" defer></script>
  <script src="{{ '/assets/js/scroll-top.js' | relative_url }}?v={{ asset_version }}" defer></script>
  <script src="{{ '/assets/js/reveal.js' | relative_url }}?v={{ asset_version }}" defer></script>
  <script src="{{ '/assets/js/image-protection.js' | relative_url }}?v={{ asset_version }}" defer></script>
</body>
</html>
