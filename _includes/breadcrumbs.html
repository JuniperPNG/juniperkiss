{%- if page.url != "/" -%}
<nav class="breadcrumbs shell" aria-label="Breadcrumb">
  <ol class="breadcrumbs__list">
    <li><a href="{{ '/' | relative_url }}">Home</a></li>
    {%- if page.layout == "post" -%}
    <li><a href="{{ '/blog/' | relative_url }}">Blog</a></li>
    <li><span aria-current="page">{{ page.title }}</span></li>
    {%- else -%}
    <li><span aria-current="page">{{ page.title }}</span></li>
    {%- endif -%}
  </ol>
</nav>
{%- endif -%}
