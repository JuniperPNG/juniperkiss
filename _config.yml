title: Juniper Kiss
tagline: PlantSciCV
description: >-
  Plant scientist, data specialist and science communicator. The stories behind
  the CV — plus a blog and university assignments with their marks.
url: "https://juniperkiss.com"
baseurl: ""
lang: en-GB

author:
  name: Juniper Boroka Kiss
  short_name: Juniper Kiss
  email: hello@juniperkiss.com

social:
  linkedin: https://www.linkedin.com/in/juniper-kiss/
  instagram: https://www.instagram.com/goesbyjuniper
  github: https://github.com/JuniperPNG

# Analytics — leave blank until a cookie-free provider is chosen.
google_analytics: ""

collections:
  posts:
    output: true

# Wix used /post/<slug>; keeping the same permalink means no inbound link breaks.
permalink: /post/:slug/

defaults:
  - scope: { path: "", type: posts }
    values:
      layout: post

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: /feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docs/
  - _migration/
  - vendor/
  - "*.ps1"
  - "*.py"
