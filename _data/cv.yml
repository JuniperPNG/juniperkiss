education:
  - dates: 2020–2022
    title: PhD, University of Southampton
    flag: gb
    country: United Kingdom
    topics:
      - icon: soil
        label: Soil metagenomics
      - icon: satellite
        label: Remote sensing
      - icon: globe
        label: Papua New Guinea
    detail: >-
      NERC-funded INSPIRE Doctoral Training Programme. Running title: "Enhancing
      ecosystem functioning to improve the resilience of subsistence farming in
      Papua New Guinea." Suspended in June 2022 after contracting malaria in PNG.
    points:
      - Designed and self-funded a PhD project addressing practical challenges in
        PNG — soil and land management — by combining Planet satellite imagery,
        GBIF occurrence data, soil shotgun metagenomics, social surveys and
        nutritional analyses.
      - Estimated the effect of slash-and-burn agriculture on local biodiversity
        using high-resolution remote sensing in Google Earth Engine (Java) and
        Python, combined with a stacked species distribution model across five
        algorithms.
      - Designed sweet potato x soil management field trials combining
        slash-and-burn soil inoculations, bokashi biofertiliser, intercropping and
        fertiliser treatments to shift soil functioning.
      - Applied mixed-effects GLMs in R to link functional gene shifts (N- and
        P-cycling) to yield responses.
    note: >-
      I got severe malaria during my fieldwork in PNG — and then saw my own blood
      smears and parasites!
    images:
      - src: /assets/cv/png-plant-id-workshop.jpg
        alt: A plant identification workshop in Papua New Guinea.
      - src: /assets/cv/plant-colouring-books-became-very-popular-during-my-phd-fiel.jpg
        alt: Plant colouring books, which became very popular during my PhD fieldwork in PNG.
      - src: /assets/cv/second-phd-outline.jpg
        alt: The outline of my second PhD project.

  - dates: 2019–2020
    title: MRes (Distinction), University of Bristol, based at the University of Exeter
    flag: gb
    country: United Kingdom
    topics:
      - icon: banana
        label: Bananas
      - icon: fungus
        label: Panama disease
      - icon: data
        label: Bayesian modelling
    detail: >-
      BBSRC-funded SWBio Doctoral Training Programme. Running title: "Preparing
      for Fusarium wilt of bananas in Latin America." Exited with an MRes with
      Distinction in September 2020.
    points:
      - Enrolled in the SWBio Doctoral Training Programme but exited after one year
        due to sexual harassment.
      - Designed and carried out in vitro and greenhouse experiments on the
        lifecycle of Panama disease (Fusarium oxysporum f. sp. cubense TR4) on
        bananas, and the effect of banana root exudates on TR4 germination.
      - Carried out spatial modelling and economic analysis of local banana price
        shocks in the Philippines caused by extreme weather, using a TV-STAR
        economic model and an Empirical Orthogonal Teleconnections approach.
      - Developed a theoretical mathematical model (SIXA) to estimate the
        reliability of microbial biological control agents against TR4 in the
        Philippines, suggesting different species and strains at different times of
        year and in different places.
      - Ran a Bayesian multi-level meta-analysis in Stan of all biological control
        agents against banana pests and diseases, showing that in vitro and in vivo
        trials report much larger effect sizes than field trials.
    note: >-
      My supervisor got naked next to me, so I decided to leave my first PhD.
    images:
      - src: /assets/cv/first-phd-fusarium-tr4-trials-against-cavendish-bananas.jpg
        alt: Fusarium TR4 trials against Cavendish bananas.
      - src: /assets/cv/largest-banana-germplasm-collection-at-ku-lueven.jpg
        alt: The largest banana germplasm collection, at KU Leuven.
      - src: /assets/cv/modelling-projects.jpg
        alt: Output from my modelling projects.
      - src: /assets/cv/banana-sucker-replantation-in-costa-rica.jpg
        alt: Banana sucker replantation in Costa Rica.

  - dates: 2017–2019
    title: BSc (Hons) Plant Biology, First Class — Aberystwyth University, Wales
    flag: wales
    country: Wales
    topics:
      - icon: bramble
        label: Bramble taxonomy
      - icon: leaf
        label: Plant biology
    detail: >-
      Transferred into the second year. Graduated with First Class honours and as
      Top Student within the university and amongst Royal Society of
      Biology-accredited courses in the UK.
    note: >-
      Nepal changed everything. I was applying to universities to switch to Plant
      Biology right after I flew back to Cambridge.
    images:
      - src: /assets/cv/my-bramble-project-detangled-150-year-old-classification-sys.jpg
        alt: >-
          My bramble project untangled a 150-year-old classification system by
          combining geometric morphometrics with three-loci phylogenetic analysis.

  - dates: 2014–2017
