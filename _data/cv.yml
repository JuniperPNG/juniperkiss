    flag: gb
    country: United Kingdom
    topics:
      - icon: globe
        label: Marine biology
      - icon: people
        label: Founded GOES magazine
    detail: Studied part-time over three years.
    note: >-
      I moved to Southampton in 2014 to study Oceanography, but ran out of money
