experience:
  - role: Global Tree Seed Bank Data Officer
    org: Royal Botanic Gardens, Kew (Wakehurst, UK)
    dates: 2025–present
    flag: gb
    country: United Kingdom
    topics:
      - icon: seed
        label: Seed banking
      - icon: data
        label: Data warehousing
      - icon: map
        label: Species distribution modelling
    points:
      - Managing the Millennium Seed Bank Data Warehouse on BRAHMS — reviewing and
        approving user requests, supporting curators and coordinators, and leading
        the BRAHMS7 to BRAHMS8 migration.
      - Optimising and maintaining ICMS/Earthcape to Data Warehouse pipelines in R,
        Python and SQL, delivering a full plant taxonomy update (POWO backbone
        matching, synonym resolution, IUCN status prediction, recalcitrance
        prediction, useful-species categorisation).
      - Producing clean, analysis-ready datasets and exploratory statistics for GTSB
        reporting, including data completeness, plant trait coverage, seed viability
        predictions, germination modelling and priority-species representation.
      - Developing species distribution modelling workflows (for example in the
        Dominican Republic) that integrate cleaned occurrence data, environmental
        rasters and partner expertise to guide targeted in-country seed collecting.
      - Supporting and training international GTSB partners, regional coordinators
        and internal colleagues on data standards, templates, taxonomy and
        reproducible workflows.
      - Collaborating closely with curators, scientists, IT teams and global partners
        to ensure plant conservation data are accurate, traceable and fit for
        decision-making across ex situ and in situ programmes.
    images:
      - src: /assets/cv/dominican-republic-species-distribution-modelling.jpg
        alt: Species distribution modelling output for the Dominican Republic.
      - src: /assets/cv/brahms-migration.jpg
        alt: Planning the BRAHMS7 to BRAHMS8 data migration.
      - src: /assets/cv/example-workflow-that-i-have-developed.jpg
        alt: An example of a data workflow I developed.

  - role: Technical Advisor
    org: >-
      Malaria Atlas Project — Dar es Salaam and Perth nodes, based at Geospatial
      Health and Development, The Kids Research Institute Australia (Perth, WA)
    dates: 09/2024–2025
    flag: tz
    country: Tanzania and Australia
    topics:
      - icon: mosquito
        label: Malaria
      - icon: map
        label: Bayesian geospatial modelling
      - icon: people
        label: ECR training
    points:
      - Streamlined and revamped scalable global and national Bayesian geospatial
        workflows (INLA, HBHI) using Posit Workbench on AWS with GitLab CI/CD.
      - Supported the Global Burden of Disease modelling group by migrating and
        improving a 42-stage modelling pipeline to AWS — refactoring stages for AWS
        Batch, optimising parallelisation, shapefile processing, and writing new R
        packages and tools for data extraction and cleaning.
      - Developed a new pipeline for geolocating health facilities and DHS/MIS survey
        clusters using Google Maps APIs, fuzzy matching and machine learning in
        RShiny apps — directly supporting CHAI, IDEM and NMCPs, and improving
        programme efficiency in five countries.
      - Built around 15 robust RShiny apps using asynchronous programming and EC2
        deployment, both for internal data processing and as stand-alone secure apps
        for external partners.
      - Led and designed the first hybrid cohort of the MAP Dar ECR Training and
        Mentorship Programme to increase research capacity in coding, spatial
        modelling, communication and leadership in Tanzania and Zambia, with a 100%
        satisfaction rate across the 10 participants.
    link: https://juniperpng.github.io/MAP_training/
    link_label: MAP ECR Training Programme
    note: >-
      I designed and led the first hybrid ECR development programme for Tanzanian
      and Zambian researchers — coding, spatial modelling and leadership.
    video: ixgiqMiL97Q
    video_label: welcome to the MAP Dar ECR Programme, Cohort 1
    images:
      - src: /assets/cv/example-dhs-and-mis-survey-data-in-tanzania-and-zambia-visua.png
        alt: A visualisation of DHS and MIS survey data in Tanzania and Zambia.
      - src: /assets/cv/inla-model-diagnostics.jpg
        alt: INLA model diagnostics.
      - src: /assets/cv/lancet-malaria-mapping-paper.jpg
        alt: The Lancet paper mapping global Plasmodium falciparum and vivax malaria.

  - role: Extension Group Leader
    org: Department of Industry, Trade and Tourism, Northern Territory Government (Darwin, NT)
    dates: 09/2023–04/2024
    flag: au
    country: Australia
    topics:
      - icon: people
        label: Extension and leadership
      - icon: leaf
        label: Horticulture
      - icon: talk
