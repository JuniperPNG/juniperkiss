    points:
      - Led a team of seven extension officers across Darwin, Katherine and Alice
        Springs, developed extension capacity for all researchers and supported
        approximately 38 projects.
      - Aligned research and extension activities with the Agribusiness Strategy 2030
        targets in NT plant and livestock industries — engaging producers directly,
        running stakeholder mapping workshops and developing the NT Extension Strategy.
      - Supported research staff with field trials (cotton, peanut, grassland
        management, mango postharvest processing, watermelon soil management, cattle
        nutrition), coordinating updates and feedback from growers and researchers.
      - Managed, hired and motivated staff, and maintained professional development
        pathways including fortnightly team mini-workshops on data, graphic design
        and social surveys.
      - Co-developed research proposals (GRDC, MLA, Hort Innovation) totalling
        AU$2.1m, managed projects and delivered milestones, and presented at field
