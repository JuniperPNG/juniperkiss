    points:
      - Designed and carried out an independent research project on British bramble taxonomy.
      - Collected over 150 bramble leaves from contrasting UK ecosystems and used
        image analysis (ImageJ) for geometric morphometrics (MorphoJ and R).
      - Extracted leaf tissue DNA and ran three-loci PCR at Eötvös Loránd University,
        Budapest, for phylogenetic analysis.
      - Completed the Introduction to Geometric Morphometrics intensive course by
        Transmitting Science.
      - Developed a bramble cane propagation protocol using woody canes — a first in the UK.
