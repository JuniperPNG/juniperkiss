profile: >-
  Trained plant scientist with extensive experience in ecological research and
  agricultural extension across Australia, the UK, Europe, the USA, Namibia,
  Nepal, the Philippines, Costa Rica, Tanzania and Papua New Guinea. Passionate
  about putting research into practice: data, stakeholder engagement, extension
  and science communication.

