    points:
      - Modernised global malaria mapping through database updates (extractions from
        PDFs, APIs and SQL), led the platform shift from HPC to Posit Workbench, and
        improved 8 stages of a 42-stage modelling pipeline including the PfPR cube
        (1.5 TB RAM; improved sensitivity analysis and parallelisation).
      - Led the spatial analysis of anti-malarial resistance SNPs with Swiss TPH and
        Novartis, providing intervention targets for new anti-malarial vaccines.
      - Supported three research projects — including the Gates Foundation
        Goalkeepers project, treatment delay modelling, severe malaria modelling and
        seasonality modelling — and contributed to manuscripts including Lancet
        publications.
      - Created data visualisations and RShiny apps in RStudio Pro for three
        research projects, including the Gates Foundation Goalkeepers project.
    note: >-
      My application was basically "I had malaria, it was cool, I love data, can I
      come?" — and they said yes!
    images:
